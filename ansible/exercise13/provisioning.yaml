---
# This play configures all inventory hosts and branches by OS where required.
- name: Provisioning servers
  hosts: all
  become: yes
  tasks:
    # Use loops to install multiple packages with each platform's package
    # manager; the condition selects the matching operating system.
    - name: Install ntp agent on centos
      yum:
        name: "{{item}}"
        state: present
      when: ansible_distribution == "CentOS"
      loop:
        - chrony
        - wget
        - git
        - zip
        - unzip

    # Ubuntu packages are installed with apt, refreshing its package index.
    - name: Install ntp agent on Ubuntu
      apt:
        name: "{{item}}"
        state: present
        update_cache: yes
      when: ansible_distribution == "Ubuntu"
      loop:
        - chrony
        - wget
        - git
        - zip
        - unzip

    # This separate task illustrates installing one Ubuntu package with apt.
    - name: Install ntp agent on Ubuntu
      apt:
        name: chrony
        state: present
        update_cache: yes
      when: ansible_distribution == "Ubuntu"

    # This task is incomplete as written: the service module needs a name and
    # desired state. The configured service tasks below show both.
    - name: Start service on centos
      service:

    - name: Start service on centos
      service:
        name: chronyd
        state: started
        enabled: yes
      when: ansible_distribution == "CentOS"

    - name: Start service on ubuntu
      service:
        name: chrony
        state: started
        enabled: yes
      when: ansible_distribution == "Ubuntu"

    # copy writes literal content to the managed host.
    - name: Banner file
      ansible.builtin.copy:
        content: '# This server is managed by ansible. No manual changes please.'
        dest: /etc/motd

    # Ensure the directory exists; file state=directory is idempotent.
    - name: Create a folder
      ansible.builtin.file:
        path: /opt/test21
        state: directory

    # template substitutes the NTP variables in the source file before
    # installing it. A changed configuration notifies its matching handler.
    - name: Deploy ntp agent conf on centos
      ansible.builtin.template:
        src: templates/ntpconf_centos
        dest: /etc/chrony.conf
        backup: yes
      when: ansible_distribution == "CentOS"
      notify:
        - reStart service on centos

    # Ubuntu uses a different config destination and service handler.
    - name: Deploy ntp agent conf on ubuntu
      ansible.builtin.template:
        src: templates/ntpconf_ubuntu
        dest: /etc/chrony/chrony.conf
        backup: yes
      when: ansible_distribution == "Ubuntu"
      notify:
        - reStart service on ubuntu

  # Handlers run at the end of the play and only when notified by a task that
  # changed something, avoiding unnecessary service restarts on repeat runs.
  handlers:
    - name: reStart service on centos
      service:
        name: chronyd
        state: restarted
        enabled: yes
      when: ansible_distribution == "CentOS"

    - name: reStart service on ubuntu
      service:
        name: chrony
        state: restarted
        enabled: yes
      when: ansible_distribution == "Ubuntu"
