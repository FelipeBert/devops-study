[defaults]
# Host-key verification is disabled for this lab; enable it in real environments.
host_key_checking=False
# Resolve the inventory relative to the exercise directory.
inventory=./inventory
# Manage up to three inventory hosts concurrently.
forks=3
# Store Ansible's run log at this path.
log_path=/var/log/ansible.log

[privilege_escalation]
# Use sudo for privileged tasks without asking for a become password.
become=True
become_method=sudo
become_ask_pass=False
