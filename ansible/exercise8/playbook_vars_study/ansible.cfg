[defaults]
# Skip SSH host-key verification (lab convenience; not recommended in production).
host_key_checking=False
# Select this directory's inventory when Ansible runs from this directory.
inventory=./inventory
# Maximum number of hosts configured concurrently.
forks=3
# Location for Ansible's log output.
log_path=/var/log/ansible.log

[privilege_escalation]
# Escalate task privileges with sudo without prompting for a password.
become=True
become_method=sudo
become_ask_pass=False
