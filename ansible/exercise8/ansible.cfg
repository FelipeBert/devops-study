[defaults]
# Skip SSH host-key verification. Convenient for a disposable lab, but it
# removes protection against connecting to an unexpected host.
host_key_checking=False
# Use the inventory next to this config when commands run from this directory.
inventory=./inventory
# Run at most three hosts concurrently.
forks=3
# Write Ansible logs to this path; ensure it exists and is appropriately secured.
log_path=/var/log/ansible.log

[privilege_escalation]
# Use sudo for tasks that require elevated privileges; do not prompt for a
# become password, so the remote user must be configured for passwordless sudo.
become=True
become_method=sudo
become_ask_pass=False
