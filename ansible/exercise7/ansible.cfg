[defaults]
# Disable SSH host-key prompts. Convenient for labs, but weaker against
# man-in-the-middle attacks; verify host keys in production.
host_key_checking=False
# Use the inventory file relative to the directory where Ansible is run.
inventory=./inventory
# Run up to three hosts concurrently; increase only when controller and
# managed hosts have enough capacity.
forks=3
# Write Ansible logs to this path. Ensure the user running Ansible can write
# here, and protect the log because it may contain sensitive operational data.
log_path=/var/log/ansible.log

[privilege_escalation]
# Enable privilege escalation for tasks that require elevated permissions.
become=True
# Use sudo as the privilege-escalation mechanism.
become_method=sudo
# Do not prompt for a sudo password; configure appropriate sudoers access.
become_ask_pass=False
