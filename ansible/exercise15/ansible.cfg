[defaults]
# Disabled for this lab; production environments should verify SSH host keys.
host_key_checking=False
# Resolve the inventory from the current exercise directory.
inventory=./inventory
# Run tasks on up to three hosts concurrently.
forks=3
# Store Ansible's log output at this path.
log_path=/var/log/ansible.log

[privilege_escalation]
# Use sudo without prompting; the SSH user must be allowed to sudo this way.
become=True
become_method=sudo
become_ask_pass=False
