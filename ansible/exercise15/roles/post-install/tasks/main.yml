---
# Role tasks run when a play includes post-install.
# Distribution facts select the matching package manager and service name.
- name: Install ntp agent on centos
  yum:
    # item is the current package name from the loop.
    name: "{{item}}"
    state: present
  when: ansible_distribution == "CentOS"
  loop:
    - chrony
    - wget
    - git
    - zip
    - unzip

# Use Ubuntu's apt module and refresh package metadata before installing.
- name: Install ntp agent on Ubuntu
  apt:
    name: "{{item}}"
    state: present
    update_cache: yes
  when: ansible_distribution == "Ubuntu"
  loop:
    - chrony
    - wget
    - git
    - zip
    - unzip

# This repeats the Chrony install already in the Ubuntu loop; it is idempotent
# and illustrates an explicit one-package installation task.
- name: Install ntp agent on Ubuntu
  apt:
    name: chrony
    state: present
    update_cache: yes
  when: ansible_distribution == "Ubuntu"

# This task is incomplete as written: service requires a name and desired state.
- name: Start service on centos
  service:

# The service identifiers differ between the supported operating systems.
- name: Start service on centos
  service:
    name: chronyd
    state: started
    enabled: yes
  when: ansible_distribution == "CentOS"

- name: Start service on ubuntu
  service:
    name: chrony
    state: started
    enabled: yes
  when: ansible_distribution == "Ubuntu"

# copy writes literal content on the managed host; file ensures a directory
# exists. Both modules are idempotent for these desired states.
- name: Banner file
  ansible.builtin.copy:
    content: '# This server is managed by ansible. No manual changes please.'
    dest: /etc/motd

- name: Create a folder
  ansible.builtin.file:
    path: "{{mydir}}"
    state: directory

# template renders the NTP variables, then notify asks the matching handler
# to restart Chrony only if the rendered file changed.
- name: Deploy ntp agent conf on centos
  ansible.builtin.template:
    src: ntpconf_centos.j2
    dest: /etc/chrony.conf
    backup: yes
  when: ansible_distribution == "CentOS"
  notify:
    - reStart service on centos

# Ubuntu uses its own template and configuration destination.
- name: Deploy ntp agent conf on ubuntu
  ansible.builtin.template:
    src: ntpconf_ubuntu.j2
    dest: /etc/chrony/chrony.conf
    backup: yes
  when: ansible_distribution == "Ubuntu"
  notify:
    - reStart service on ubuntu

# copy transfers a static asset from the role's files/ directory without
# evaluating Jinja expressions.
- name: Dump file
  copy:
    src: myfile.txt
    dest: /tmp/myfile.txt
