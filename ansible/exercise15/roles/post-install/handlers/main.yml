---
# handlers file for post-install
# Handlers run at the end of the play only when notified by a changed task.
- name: reStart service on centos
  service:
    name: chronyd
    state: restarted
    enabled: yes
  when: ansible_distribution == "CentOS"

- name: reStart service on ubuntu
  service:
    name: chrony
    state: restarted
    enabled: yes
  when: ansible_distribution == "Ubuntu"
