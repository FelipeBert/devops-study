[defaults]
# Skip SSH host-key verification (use only in a controlled lab environment).
host_key_checking=False
# Use the inventory file in this exercise directory.
inventory=./inventory
# Limit the number of hosts Ansible manages concurrently.
forks=3
# File where Ansible writes its logs.
log_path=/var/log/ansible.log

[privilege_escalation]
# Use sudo for privileged tasks without prompting for a become password.
become=True
become_method=sudo
become_ask_pass=False
