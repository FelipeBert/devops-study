---
# Configure all hosts with distribution-specific package and service tasks.
- name: Provisioning servers
  hosts: all
  become: yes
  tasks:
    # A loop applies the same package operation to each listed item.
    - name: Install ntp agent on centos
      yum:
        name: "{{item}}"
        state: present
      when: ansible_distribution == "CentOS"
      loop:
        - chrony
        - wget
        - git
        - zip
        - unzip

    # Use apt on Ubuntu and refresh package metadata before installation.
    - name: Install ntp agent on Ubuntu
      apt:
        name: "{{item}}"
        state: present
        update_cache: yes
      when: ansible_distribution == "Ubuntu"
      loop:
        - chrony
        - wget
        - git
        - zip
        - unzip

    # This separate task illustrates installing one Ubuntu package with apt.
    - name: Install ntp agent on Ubuntu
      apt:
        name: chrony
        state: present
        update_cache: yes
      when: ansible_distribution == "Ubuntu"

    # This task is incomplete as written: the service module needs a name and
    # desired state. The configured service tasks below show both.
    - name: Start service on centos
      service:

    - name: Start service on centos
      service:
        name: chronyd
        state: started
        enabled: yes
      when: ansible_distribution == "CentOS"

    - name: Start service on ubuntu
      service:
        name: chrony
        state: started
        enabled: yes
      when: ansible_distribution == "Ubuntu"

    # copy writes literal content to the remote host.
    - name: Banner file
      ansible.builtin.copy:
        content: '# This server is managed by ansible. No manual changes please.'
        dest: /etc/motd

    # template renders Jinja variables on the controller before copying the
    # OS-specific Chrony configuration to the managed host.
    - name: Deploy ntp agent conf on centos
      ansible.builtin.template:
        src: templates/ntpconf_centos
        dest: /etc/chrony.conf
        backup: yes
      when: ansible_distribution == "CentOS"

    # Ubuntu stores the Chrony config at a different path than CentOS.
    - name: Deploy ntp agent conf on ubuntu
      ansible.builtin.template:
        src: templates/ntpconf_ubuntu
        dest: /etc/chrony/chrony.conf
        backup: yes
      when: ansible_distribution == "Ubuntu"

    # Restart Chrony after deploying a config so it loads the new settings.
    - name: reStart service on centos
      service:
        name: chronyd
        state: restarted
        enabled: yes
      when: ansible_distribution == "CentOS"


    - name: reStart service on ubuntu
      service:
        name: chrony
        state: restarted
        enabled: yes
      when: ansible_distribution == "Ubuntu"

    # Ensure this directory exists; file state=directory is idempotent.
    - name: Create a folder
      ansible.builtin.file:
        path: /opt/test21
        state: directory
