# Versão da API Kubernetes usada pelo recurso Pod.
apiVersion: v1
# kind define o tipo de recurso que o Kubernetes deve criar.
kind: Pod
metadata:
  # O nome deve ser único dentro do namespace.
  name: nginx12
  # O namespace precisa existir; ele delimita este Pod e seu nome.
  namespace: kubekart
spec:
  # Um Pod reúne um ou mais containers relacionados no mesmo nó.
  containers:
    - name: nginx
      # Uma tag explícita deixa clara a versão da imagem utilizada.
      image: nginx:1.14.2
      ports:
        # Documenta a porta em que o container escuta, mas não expõe o Pod
        # fora do cluster. Use um Service para acesso estável pela rede.
        - containerPort: 80

